[project]
name = "ai-toolkit"
version = "0.7.20"
description = "AI Toolkit for training and fine-tuning models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "torchaudio",
    "torchao==0.10.0",
    "safetensors",
    "diffusers",
    "transformers==4.57.3",
    "lycoris-lora==1.8.3",
    "flatten_json",
    "pyyaml",
    "oyaml",
    "tensorboard",
    "kornia",
    "invisible-watermark",
    "einops",
    "accelerate",
    "toml",
    "albumentations==1.4.15",
    "albucore==0.0.16",
    "pydantic",
    "omegaconf",
    "k-diffusion",
    "open_clip_torch",
    "timm",
    "prodigyopt",
    "controlnet_aux==0.0.10",
    "python-dotenv",
    "bitsandbytes",
    "hf_transfer",
    "lpips",
    "pytorch_fid",
    "optimum-quanto==0.2.4",
    "sentencepiece",
    "huggingface_hub",
    "peft",
    "gradio",
    "python-slugify",
    "opencv-python",
    "pytorch-wavelets==1.3.0",
    "matplotlib==3.10.1",
    "setuptools==69.5.1",
    "scipy==1.12.0",
    "av==16.0.1",
    "torchcodec; platform_machine != 'aarch64' or sys_platform != 'linux'",
    "qwen-vl-utils>=0.0.14",
    "psutil>=7.2.1",
]

# DGX-specific dependencies are documented in dgx_requirements.txt
# Use those version pins instead when running on DGX systems

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black",
    "ruff",
]

[tool.uv]
# PyTorch CUDA index selection:
# - pytorch-cu130: CUDA 13.0 (DGX Spark / GB10 aarch64, sm_121)
# - pytorch-cu128: CUDA 12.8 (RTX 50-series x86_64, sm_120)
# - pytorch-cu126: CUDA 12.6 (RTX 40-series and older)
# - pytorch-cu124: CUDA 12.4
# - pytorch-cpu: CPU only
# Currently: cu130 for aarch64 Linux, cu128 for x86_64 Linux

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers", rev = "8600b4c10d67b0ce200f664204358747bd53c775" }
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.black]
line-length = 120
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
